name: Auto-publish

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  publish-checkpoint-job:
    # Only try to publish if:
    # * Repo is self (prevents running from forks)
    # * Branch is `main`
    if: |
      github.repository == 'google/orbax'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 30

    steps:
    # 1. Detect version bump and create GitHub release/tag (skip direct PyPI upload)
    - id: auto_publish
      uses: etils-actions/pypi-auto-publish@d0603b1e896ce8b754fd7df30731623c93546e89 # v1
      with:
        pypi-token: skip
        gh-token: ${{ secrets.GITHUB_TOKEN }}
        path: "./checkpoint/"
        pkg-name: orbax-checkpoint
        parse-changelog: true

    - name: Authenticate to Google Cloud (OSS Exit Gate)
      if: steps.auto_publish.outputs.is-released == 'true'
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

    - name: Set up Cloud SDK
      if: steps.auto_publish.outputs.is-released == 'true'
      uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

    - name: Build, stage orbax-checkpoint to OSS Exit Gate, and upload manifest
      if: steps.auto_publish.outputs.is-released == 'true'
      env:
        PKG_VER: ${{ steps.auto_publish.outputs.version }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        python3 -m pip install --upgrade build twine
        rm -rf dist_ckpt
        python3 -m build ./checkpoint/ --outdir dist_ckpt

        set +e
        gcloud artifacts versions describe "${PKG_VER}" \
          --package="orbax-checkpoint" \
          --project="oss-exit-gate-prod" \
          --location="us" \
          --repository="orbax--pypi" \
          --format="value(name)" > /dev/null 2> describe.err
        DESC_RC=$?
        set -e
        if [ "$DESC_RC" -eq 0 ]; then
          gcloud artifacts versions delete "${PKG_VER}" \
            --package="orbax-checkpoint" \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="orbax--pypi" \
            --quiet
        elif ! grep -Eqi "NOT_FOUND|not.found|404" describe.err; then
          cat describe.err >&2
          exit "$DESC_RC"
        fi

        TWINE_PASSWORD="$(gcloud auth print-access-token)"
        python3 -m twine upload \
          --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/orbax--pypi/" \
          -u oauth2accesstoken \
          -p "${TWINE_PASSWORD}" \
          dist_ckpt/*

        cat <<EOF > manifest.json
        {
          "publish_all": false,
          "publishing_groups": [
            {
              "packages": [
                {
                  "name": "orbax-checkpoint",
                  "version": "${PKG_VER}"
                }
              ]
            }
          ]
        }
        EOF
        gcloud storage cp manifest.json \
          "gs://oss-exit-gate-prod-projects-bucket/orbax/pypi/manifests/manifest-orbax-checkpoint-${PKG_VER}-${RUN_ID}-${RUN_ATTEMPT}.json"

  publish-export-job:
    # Only try to publish if:
    # * Repo is self (prevents running from forks)
    # * Branch is `main`
    if: |
      github.repository == 'google/orbax'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 30

    steps:
    # 1. Detect version bump (skip direct PyPI upload and skip GitHub release creation)
    - id: auto_publish
      uses: etils-actions/pypi-auto-publish@d0603b1e896ce8b754fd7df30731623c93546e89 # v1
      with:
        # NOTE: Do not use gh-token here, as it would conflict with orbax-checkpoint.
        pypi-token: skip
        path: "./export/"
        pkg-name: orbax-export

    - name: Authenticate to Google Cloud (OSS Exit Gate)
      if: steps.auto_publish.outputs.is-released == 'true'
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

    - name: Set up Cloud SDK
      if: steps.auto_publish.outputs.is-released == 'true'
      uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

    - name: Build, stage orbax-export to OSS Exit Gate, and upload manifest
      if: steps.auto_publish.outputs.is-released == 'true'
      env:
        PKG_VER: ${{ steps.auto_publish.outputs.version }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        python3 -m pip install --upgrade build twine
        rm -rf dist_expt
        python3 -m build ./export/ --outdir dist_expt

        set +e
        gcloud artifacts versions describe "${PKG_VER}" \
          --package="orbax-export" \
          --project="oss-exit-gate-prod" \
          --location="us" \
          --repository="orbax--pypi" \
          --format="value(name)" > /dev/null 2> describe.err
        DESC_RC=$?
        set -e
        if [ "$DESC_RC" -eq 0 ]; then
          gcloud artifacts versions delete "${PKG_VER}" \
            --package="orbax-export" \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="orbax--pypi" \
            --quiet
        elif ! grep -Eqi "NOT_FOUND|not.found|404" describe.err; then
          cat describe.err >&2
          exit "$DESC_RC"
        fi

        TWINE_PASSWORD="$(gcloud auth print-access-token)"
        python3 -m twine upload \
          --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/orbax--pypi/" \
          -u oauth2accesstoken \
          -p "${TWINE_PASSWORD}" \
          dist_expt/*

        cat <<EOF > manifest.json
        {
          "publish_all": false,
          "publishing_groups": [
            {
              "packages": [
                {
                  "name": "orbax-export",
                  "version": "${PKG_VER}"
                }
              ]
            }
          ]
        }
        EOF
        gcloud storage cp manifest.json \
          "gs://oss-exit-gate-prod-projects-bucket/orbax/pypi/manifests/manifest-orbax-export-${PKG_VER}-${RUN_ID}-${RUN_ATTEMPT}.json"
