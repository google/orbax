[build-system]
requires = ["flit_core >=3.5,<4", "grpcio-tools >=1.81.0,<1.82"]
build-backend = "_build_proto"
backend-path = ["."]

[project]
name = "orbax-checkpoint"
description = "Orbax Checkpoint"
readme = 'README.md'
license = {file = 'LICENSE'}
requires-python = '>=3.11'
authors = [{name = 'Orbax Authors', email='orbax-dev@google.com'}]
classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: Apache Software License',
    'Programming Language :: Python',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
]


keywords = ["JAX machine learning", "checkpoint", "training"]

dependencies = [
    'absl-py',
    'etils[epath,epath-gcs,epy] >= 1.15.0',
    'typing_extensions',
    'msgpack',
    'jax >= 0.6.0',
    'numpy',
    'prometheus-client >= 0.20.0',
    'pyyaml',
    'tensorstore >= 0.1.84',
    'aiofiles',
    'protobuf >= 6.33.5',
    'humanize',
    'simplejson >= 3.16.0',
    'psutil',
    'uvloop; platform_system != "Windows"',
    'nest_asyncio; platform_system == "Windows"',
]

dynamic = ['version']

[tool.flit.module]
name = "orbax.checkpoint"

[project.urls]
homepage = 'http://github.com/google/orbax'
repository = 'http://github.com/google/orbax'

[project.optional-dependencies]
docs = [
  'flax',
  'google-cloud-logging',
  'grain',
  'aiofiles',
  'tensorflow_datasets',
  'opencv-python',
  'safetensors',
  'clu',
]
testing = [
    'google-cloud-logging',
    'mock',
    'flax',
    'pytest',
    'pytest-xdist',
    'chex',
    'aiofiles',
    'safetensors',
    'torch',
    'clu',
    'tensorflow',
    'fastapi',
    'httpx',
    'grain',
]
tiering_service = [
    'aiosqlite',
    'fire',
    'greenlet',
    'grpcio-tools>=1.81.0',
    'httpx',
    'pysqlite3',
    'pytimeparse',
    'sqlalchemy>=1.4.0',
    'uvloop',
]

[tool.flit.sdist]
# Flit specific options (files to exclude from the PyPI package).
exclude = [
  # Do not release tests files on PyPI
  "**/*_test.py",
  '**/BUILD',

]
# The build backend must ship in the sdist to build wheels from it.
include = [
  "_build_proto.py",
]
